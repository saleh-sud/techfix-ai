# عامل المقالات: مرتين باليوم، مقال (~1000 كلمة عربي + نسخة إنجليزية) عبر Pollinations.ai المجاني بدون مفتاح.
# بعد الـ push، Cloudflare Pages يبني وينشر لحاله (Git integration)، وبعدها نبلّغ IndexNow (Bing / Yandex).
name: Daily articles

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 بتوقيت دمشق/السعودية
    - cron: "0 11 * * *"  # 14:00
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات في هذا التشغيل"
        default: "1"
      topic:
        description: "موضوع محدد (اختياري)"
        default: ""
      issue:
        description: "رقم صفحة الطلب (تلقائي)"
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # المجدول ينتظر موافقتك على المقال السابق؛ المطلوب منك يُكتب فوراً ضمن الحد اليومي.
      - name: Write and ask for approval
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: main
          EVENT: ${{ github.event_name }}
          COUNT: ${{ inputs.count }}
          TOPIC: ${{ inputs.topic }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/requests.mjs run
