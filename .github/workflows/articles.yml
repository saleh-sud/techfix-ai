# عامل المقالات: مرتين باليوم، مقال (~1000 كلمة عربي + نسخة إنجليزية) عبر Pollinations.ai المجاني بدون مفتاح.
# بعد الـ push، Cloudflare Pages يبني وينشر لحاله (Git integration)، وبعدها نبلّغ IndexNow (Bing / Yandex).
name: Daily articles

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 بتوقيت دمشق/السعودية
    - cron: "0 11 * * *"  # 14:00
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات في هذا التشغيل"
        default: "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # مقال واحد ينتظر موافقتك في كل مرة: لا نكتب غيره قبل أن تردّ عليه.
      - name: Is an article waiting for approval?
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --limit 50 --json headRefName --jq '[.[] | select(.headRefName | startswith("article/"))] | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "::notice::An article is still waiting for approval. Nothing new is written."

      - name: Write article
        if: steps.pending.outputs.count == '0'
        id: gen
        timeout-minutes: 60
        run: node scripts/generate-article.mjs --count 1

      - name: Build (تأكد أن الموقع يبنى قبل طلب الموافقة)
        if: steps.pending.outputs.count == '0' && steps.gen.outputs.new_urls != ''
        run: npm run build

      - name: Ask for approval (email with the article)
        if: steps.pending.outputs.count == '0' && steps.gen.outputs.new_urls != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_URLS: ${{ steps.gen.outputs.new_urls }}
          OWNER: ${{ github.repository_owner }}
        run: |
          slug=$(echo "$NEW_URLS" | cut -d' ' -f1 | awk -F/ '{print $NF}')
          case "$slug" in *[!a-z0-9-]*|"") echo "unexpected slug"; exit 1;; esac
          branch="article/$slug-${{ github.run_id }}"
          git config user.name "articles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/articles.json src/content/articles scripts/article-topics.json
          git commit -m "Article for approval: $slug"
          git push origin "$branch"
          node scripts/approval.mjs body "$slug" > /tmp/body.md
          title=$(node -p "(require('./src/data/articles.json').find(a=>a.slug==='$slug')||{}).title || '$slug'")
          gh pr create --base main --head "$branch" --title "مقال بانتظار موافقتك: $title" --body-file /tmp/body.md --assignee "$OWNER"
